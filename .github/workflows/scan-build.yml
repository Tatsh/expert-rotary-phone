jobs:
  analyze:
    defaults:
      run:
        shell: bash
    env:
      BUILD_CONFIG: Release
      DEPLOYMENT_TARGET: '12.0'
      IOS_ARCHS: arm64
      IOS_CMAKE_REF: 21598aa550701d20654c032328f7e8710a14099b
    name: scan-build
    permissions:
      contents: read
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Ninja
        run: brew install ninja
      - name: Fetch ios-cmake toolchain
        run: |
          git clone --revision="$IOS_CMAKE_REF" https://github.com/leetal/ios-cmake.git .ios-cmake
      - name: Prepare scoped compiler wrappers
        run: |
          mkdir -p .wiswa-ci
          install -m 755 .github/scripts/static-analysis.py .wiswa-ci/scan-build-cc
          install -m 755 .github/scripts/static-analysis.py .wiswa-ci/scan-build-cxx
      - name: Install Clang analyzer
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - env:
          SCAN_BUILD_CONFIGURE_COMMAND: |
            export STATIC_ANALYSIS_CC="$CC" STATIC_ANALYSIS_CXX="$CXX"
            export STATIC_ANALYSIS_REAL_CC="$(xcrun --find clang)" STATIC_ANALYSIS_REAL_CXX="$(xcrun --find clang++)"
            export CC="$GITHUB_WORKSPACE/.wiswa-ci/scan-build-cc"
            export CXX="$GITHUB_WORKSPACE/.wiswa-ci/scan-build-cxx"
            cmake \
            -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/.ios-cmake/ios.toolchain.cmake" \
            -DDEPLOYMENT_TARGET="$DEPLOYMENT_TARGET" \
            -DENABLE_BITCODE=NO \
            -DIOS_ARCHS="$IOS_ARCHS" \
            -DPLATFORM=OS64 \
            -DRHYDBG=ON \
            -DENABLE_PATCHES=ON \
            -DENABLE_OFFLINE_PATCHES=ON \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_OBJC_COMPILER="$CC" \
            -DCMAKE_OBJCXX_COMPILER="$CXX"
        name: Configure with compiler interception
        run: |-
          mkdir -p scan-build-report
          scan-build --use-analyzer="$(xcrun --find clang)" --use-cc="$(xcrun --find clang)" --use-c++="$(xcrun --find clang++)" --exclude "$(python3 .github/scripts/static-analysis.py --exclude)" -o "$RUNNER_TEMP/scan-configure" bash -eo pipefail -c "$SCAN_BUILD_CONFIGURE_COMMAND" 2>&1 | tee scan-build-report/build.log
      - env:
          SCAN_BUILD_BUILD_COMMAND: |
            export STATIC_ANALYSIS_CC="$CC" STATIC_ANALYSIS_CXX="$CXX"
            export STATIC_ANALYSIS_REAL_CC="$(xcrun --find clang)" STATIC_ANALYSIS_REAL_CXX="$(xcrun --find clang++)"
            export CC="$GITHUB_WORKSPACE/.wiswa-ci/scan-build-cc"
            export CXX="$GITHUB_WORKSPACE/.wiswa-ci/scan-build-cxx"
            cmake --build build --clean-first --parallel 2
        id: analysis
        name: Analyze a clean build
        run: |
          mkdir -p scan-build-report
          scan-build --use-analyzer="$(xcrun --find clang)" --use-cc="$(xcrun --find clang)" --use-c++="$(xcrun --find clang++)" --exclude "$(python3 .github/scripts/static-analysis.py --exclude)" -plist-html --keep-empty -v \
            -o scan-build-report/results bash -eo pipefail -c "$SCAN_BUILD_BUILD_COMMAND" \
            2>&1 | tee -a scan-build-report/build.log
      - env:
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
          ANALYSIS_SCOPE: Native sources selected by the configured build.
        if: ${{ !cancelled() }}
        name: Prepare report and verify analysis coverage
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          root = Path('scan-build-report')
          root.mkdir(exist_ok=True)
          reports = sorted(root.glob('results/*/index.html'))
          units = list(root.glob('results/*/*.plist'))
          failures = list(root.glob('results/*/failures/*'))
          complete = os.environ['ANALYSIS_OUTCOME'] == 'success' and bool(units) and not failures
          print(os.environ['ANALYSIS_SCOPE'])
          print(f'{len(units)} translation units. {len(failures)} analyzer failure files.')
          if not complete:
              raise SystemExit('Incomplete analysis; inspect the build log and analyzer failures.')
          if len(reports) > 1:
              raise SystemExit('Expected a single Clang HTML report.')
          if reports:
              shutil.copytree(reports[0].parent, root, dirs_exist_ok=True)
          else:
              for unit in units:
                  shutil.copy2(unit, root)
              (root / 'index.html').write_text(
                  '<!doctype html><html lang="en"><meta charset="utf-8">'
                  '<title>Clang static analysis</title>'
                  '<h1>No bugs reported by the enabled Clang checkers.</h1>', encoding='utf-8')
          shutil.rmtree(root / 'results')
          PY
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: scan-build-${{ github.sha }}
          path: scan-build-report
  pages:
    if: ${{ github.event_name != 'pull_request' }}
    name: Pages
    needs:
      - analyze
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: $/.github/workflows/pages.yml
name: Clang static analysis
'on':
  pull_request: {}
  push: {}
  workflow_dispatch: {}
permissions: {}
