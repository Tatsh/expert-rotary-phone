---
concurrency:
  cancel-in-progress: false
  group: pages
jobs:
  pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      - name: Configure
        run: cmake -B ${{ github.workspace }}/build -DBUILD_DOCS_ONLY=ON
      - name: Build documentation
        run: cmake --build ${{ github.workspace }}/build --target docs
      - name: Build API reference
        run: |
          npm install --no-audit --no-fund --no-save \
            --prefix "${{ runner.temp }}/scalar" @scalar/api-reference@1.66.1
          mkdir -p "${{ github.workspace }}/build/html/api"
          cp -R "${{ runner.temp }}/scalar/node_modules/@scalar/api-reference/dist/browser" \
            "${{ github.workspace }}/build/html/api/scalar"
          find "${{ github.workspace }}/build/html/api/scalar" -name '*.map' -delete
          # The bundle queries api.scalar.com on load whatever it is configured with, and would
          # route a sent request through proxy.scalar.com. Point its service hosts at a name that
          # cannot resolve, so the page cannot reach them even where its policy is not enforced.
          find "${{ github.workspace }}/build/html/api/scalar" -name '*.js' -exec sed -i \
            -e 's#https://api\.scalar\.com#https://api.scalar.invalid#g' \
            -e 's#https://proxy\.scalar\.com#https://proxy.scalar.invalid#g' \
            -e 's#https://fonts\.scalar\.com#https://fonts.scalar.invalid#g' \
            -e 's#https://registry\.scalar\.com#https://registry.scalar.invalid#g' {} +
          cp openapi.yaml "${{ github.workspace }}/build/html/api/openapi.yaml"
          cp docs/api/index.html "${{ github.workspace }}/build/html/api/index.html"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ github.workspace }}/build/html
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
name: GitHub Pages
'on':
  push:
    branches: [master]
permissions:
  contents: read
  id-token: write
  pages: write
